  container_pipeline:
    name: Staging Container Pipeline
    #needs: [trigger-integration-tests]
    #if: ${{ always() }}
    uses: ./.github/workflows/container-pipeline.yml
    with:
      registry: docker.io
      image_repository: pritam0517/vm-test
      image_tag_prefix: staging
      django_env: STAGING
      docker_context: .
      dockerfile: Dockerfile
      fail_on_gitleaks: true
      max_image_layers: 35
      max_image_size_mb: 3500
      push_image: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    secrets:
      registry_username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
      discord_webhook: ${{ secrets.discord_webhook }}

