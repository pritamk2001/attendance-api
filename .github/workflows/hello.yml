name: Credential Scanning

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

jobs:
  cred-scan:
    name: Checkout and Scan Repository
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Verify Repository
      - name: Verify Files
        run: |
          pwd
          ls -la

      # Step 3: Install Gitleaks
      - name: Install Gitleaks
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | sh -s -- -b /usr/local/bin
          gitleaks version

      # Step 4: Run Credential Scan
      - name: Scan Repository
        run: |
          mkdir -p reports

          gitleaks detect \
            --source . \
            --report-format json \
            --report-path reports/gitleaks-report.json \
            --exit-code 0

      # Step 5: Display Report
      - name: Show Report
        run: |
          cat reports/gitleaks-report.json

      # Step 6: Upload Report
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: reports/gitleaks-report.json
