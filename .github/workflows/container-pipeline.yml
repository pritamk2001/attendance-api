name: Container Pipeline

on:
  workflow_call:
    inputs:
      registry:
        required: true
        type: string
      image_repository:
        required: true
        type: string
        default: pritam0517/vm-test
      image_tag_prefix:
        required: false
        type: string
        default: ""
      django_env:
        required: false
        type: string
        default: STAGING
      docker_context:
        required: false
        type: string
        default: .
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      max_image_layers:
        required: false
        type: number
        default: 35
      max_image_size_mb:
        required: false
        type: number
        default: 3500
      push_image:
        required: false
        type: boolean
        default: false
      fail_on_gitleaks:
        required: true
        type: boolean
        default: false

    secrets:
      registry_username:
        required: false
      registry_password:
        required: false
      discord_webhook:
        required: false

    outputs:
      image_tag:
        value: ${{ jobs.container_pipeline.outputs.image_tag }}
      image_ref:
        value: ${{ jobs.container_pipeline.outputs.image_ref }}
      image_latest_ref:
        value: ${{ jobs.container_pipeline.outputs.image_latest_ref }}

permissions:
  contents: read

jobs:
  container_pipeline:
    name: Container Pipeline
    # runs-on: [self-hosted, linux, x64, aws]
    runs-on: ubuntu-latest

    # Switch back to GitHub-hosted build later by commenting the line above and
    # uncommenting the line below.
    # runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image_meta.outputs.image_tag }}
      image_ref: ${{ steps.image_meta.outputs.image_ref }}
      image_latest_ref: ${{ steps.image_meta.outputs.image_latest_ref }}

    env:
      DISCORD_WEBHOOK: ${{ secrets.discord_webhook }}
      LOCAL_IMAGE_NAME: credflow-api-ci

    steps:
      # Keep Discord notifications commented for now.
      # - name: Discord pipeline triggered alert
      #   if: ${{ env.DISCORD_WEBHOOK != '' }}
      #   run: |
      #     MESSAGE="Credflow container pipeline triggered for ${GITHUB_REF_NAME}. Commit: ${GITHUB_SHA::12}. Link: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      #     curl -X POST \
      #       -H "Content-Type: application/json" \
      #       -d "{\"content\":\"${MESSAGE}\"}" \
      #       "$DISCORD_WEBHOOK"

      - name: Image Cleanup Step
        run: |
          docker image prune -af || true
          docker builder prune -af || true

      - name: clone_repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          VERSION="8.24.3"
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Gitleaks Scan
        id: gitleaks
        continue-on-error: ${{ !inputs.fail_on_gitleaks }}
        run: |
          set +e

          gitleaks git \
            --log-opts="-1" \
            --redact \
            --report-format json \
            --report-path gitleaks-report.json \
            --exit-code 1

          EXIT_CODE=$?

          {
            echo "=================================================="
            echo "           GITLEAKS CREDENTIAL SCAN REPORT"
            echo "=================================================="
            echo
            echo "Repository : ${{ github.repository }}"
            echo "Branch     : ${{ github.ref_name }}"
            echo "Commit     : ${{ github.sha }}"
            echo "Generated  : $(date -u)"
            echo

            COUNT=0

            if [ -f gitleaks-report.json ]; then
              COUNT=$(jq length gitleaks-report.json)
            fi

            if [ "$COUNT" -eq 0 ]; then
              echo "Status : PASSED ✅"
              echo "Secrets Found : 0"

              echo "status=PASSED" >> "$GITHUB_OUTPUT"
            else
              echo "Status : FAILED ❌"
              echo "Secrets Found : $COUNT"
              echo
              echo "=================================================="

              jq -r '
                .[] |
                "Rule        : \(.RuleID)\n" +
                "File        : \(.File)\n" +
                "Line        : \(.StartLine)\n" +
                "Description : \(.Description)\n" +
                "Commit      : \(.Commit)\n" +
                "Author      : \(.Author)\n" +
                "Date        : \(.Date)\n" +
                "-----------------------------------------------"
              ' gitleaks-report.json

              echo "status=FAILED" >> "$GITHUB_OUTPUT"
            fi
          } > gitleaks-report.txt

          exit 0

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.txt

      - name: External Clone Configration
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --all --tags --prune

      - name: Set image metadata
        id: image_meta
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"

          if [ -n "${{ inputs.image_tag_prefix }}" ]; then
            IMAGE_TAG="${{ inputs.image_tag_prefix }}-${SHORT_SHA}"
            IMAGE_LATEST_TAG="${{ inputs.image_tag_prefix }}-latest"
          else
            IMAGE_TAG="${SHORT_SHA}"
            IMAGE_LATEST_TAG="latest"
          fi

          IMAGE_REF="${{ inputs.registry }}/${{ inputs.image_repository }}:${IMAGE_TAG}"
          IMAGE_LATEST_REF="${{ inputs.registry }}/${{ inputs.image_repository }}:${IMAGE_LATEST_TAG}"

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "image_latest_ref=$IMAGE_LATEST_REF" >> "$GITHUB_OUTPUT"

      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"
      #     cache: pip
      #     cache-dependency-path: requirements.txt

      # - name: Install CI tooling
      #   run: |
      #     python -m pip install --upgrade pip
      #     pip install -r requirements.txt
      #     pip install pre-commit

      # Existing repo content contains many detect-secrets hits, so keep this
      # disabled until the repository has a baseline or the findings are cleaned up.
      # - name: Cred Scanning Nr
      #   run: pre-commit run detect-secrets --all-files

      # - name: pre hook
      #   env:
      #     SKIP: detect-secrets
      #   run: pre-commit run --all-files --show-diff-on-failure

      - name: build_image
        run: |
          docker build \
            --build-arg DJANGO_ENV=${{ inputs.django_env }} \
            -f "${{ inputs.dockerfile }}" \
            -t "${LOCAL_IMAGE_NAME}:${{ steps.image_meta.outputs.image_tag }}" \
            -t "${{ steps.image_meta.outputs.image_ref }}" \
            -t "${{ steps.image_meta.outputs.image_latest_ref }}" \
            "${{ inputs.docker_context }}"

      - name: Trivy Vulnerability Scan
        id: trivy_vuln
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE_NAME }}:${{ steps.image_meta.outputs.image_tag }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln

      - name: Trivy Secret Scan
        id: trivy_secret
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE_NAME }}:${{ steps.image_meta.outputs.image_tag }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          scanners: secret

      - name: Generate Trivy Report
        if: always()
        run: |
          {
            echo "===================================================="
            echo "                 TRIVY SCAN REPORT"
            echo "===================================================="
            echo
            echo "Repository : ${{ github.repository }}"
            echo "Branch     : ${{ github.ref_name }}"
            echo "Image      : ${{ steps.image_meta.outputs.image_ref }}"
            echo "Generated  : $(date -u)"
            echo

            if [ -f trivy-results.sarif ]; then
              COUNT=$(jq '[.runs[].results[]] | length' trivy-results.sarif)

              if [ "$COUNT" -eq 0 ]; then
                echo "Status : PASSED ✅"
                echo "High/Critical Vulnerabilities : 0"
              else
                echo "Status : FAILED ❌"
                echo "High/Critical Vulnerabilities : $COUNT"
                echo

                jq -r '
                .runs[].results[] |
                "Severity : \(.level)\nRule : \(.ruleId)\nMessage : \(.message.text)\n------------------------------------------"
                ' trivy-results.sarif
              fi
            else
              echo "Trivy report not generated."
            fi
          } > trivy-report.txt

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

      - name: Registry Login
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: push_image
        if: ${{ inputs.push_image }}
        run: |
          docker push "${{ steps.image_meta.outputs.image_ref }}"
          docker push "${{ steps.image_meta.outputs.image_latest_ref }}"

      - name: Image Cleanup Step Nr
        if: always()
        run: |
          docker image rm "${LOCAL_IMAGE_NAME}:${{ steps.image_meta.outputs.image_tag }}" || true
          docker image rm "${{ steps.image_meta.outputs.image_ref }}" || true
          docker image rm "${{ steps.image_meta.outputs.image_latest_ref }}" || true
          docker image prune -af || true
          docker builder prune -af || true

      - name: Send Security Reports to Discord
        if: always() && env.DISCORD_WEBHOOK != ''
        run: |
          GITLEAKS_STATUS="${{ steps.gitleaks.outputs.status }}"
          TRIVY_STATUS="${{ steps.trivy_vuln.outcome }}"

          [ -z "$GITLEAKS_STATUS" ] && GITLEAKS_STATUS="UNKNOWN"
          [ -z "$TRIVY_STATUS" ] && TRIVY_STATUS="UNKNOWN"

          CONTENT=$(cat <<EOF
          🔒 **Container Security Scan Report**

          Repository : ${{ github.repository }}
          Branch : ${{ github.ref_name }}

          Gitleaks : ${GITLEAKS_STATUS}
          Trivy : ${TRIVY_STATUS}

          Run:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )

          if [ "${GITLEAKS_STATUS}" = "FAILED" ] && [ -f gitleaks-report.txt ]; then
            GITLEAKS_ARG="-F file1=@gitleaks-report.txt"
          else
            GITLEAKS_ARG=""
          fi

          if [ -f trivy-report.txt ]; then
            TRIVY_ARG="-F file2=@trivy-report.txt"
          else
            TRIVY_ARG=""
          fi

          eval curl \
            -F "content=${CONTENT}" \
            ${GITLEAKS_ARG} \
            ${TRIVY_ARG} \
            "$DISCORD_WEBHOOK"

      - name: post hook
        if: always()
        run: |
          {
            echo "## Container pipeline summary"
            echo ""
            echo "- Status: ${{ job.status }}"
            echo "- Image tag: ${{ steps.image_meta.outputs.image_tag }}"
            echo "- Image ref: ${{ steps.image_meta.outputs.image_ref }}"
            echo "- Latest convenience tag: ${{ steps.image_meta.outputs.image_latest_ref }}"
            echo "- Push enabled: ${{ inputs.push_image }}"
          } >> "$GITHUB_STEP_SUMMARY"
