name: Credential Scanning, Trivy Scan & Docker Build

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:
    inputs:
      docker_repo:
        description: "Docker Repository Name"
        required: true
        default: "vm-process"
        type: string

env:
  DEFAULT_IMAGE_NAME: vm-process

jobs:
# -------------------------------------------------------------
# GITLEAKS SCAN
# -------------------------------------------------------------
  credential-scan:
    name: Credential Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Gitleaks Scan
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks SARIF Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: results.sarif

      - name: Generate Readable Report
        if: always()
        run: |
          echo "====================================================" > gitleaks-report.txt
          echo "           GITLEAKS CREDENTIAL SCAN REPORT" >> gitleaks-report.txt
          echo "====================================================" >> gitleaks-report.txt
          echo "" >> gitleaks-report.txt
          echo "Repository : ${{ github.repository }}" >> gitleaks-report.txt
          echo "Branch     : ${{ github.ref_name }}" >> gitleaks-report.txt
          echo "Triggered By : ${{ github.actor }}" >> gitleaks-report.txt
          echo "Commit ID  : ${{ github.sha }}" >> gitleaks-report.txt
          echo "Workflow   : ${{ github.workflow }}" >> gitleaks-report.txt
          echo "Run Number : ${{ github.run_number }}" >> gitleaks-report.txt
          echo "Generated  : $(date -u)" >> gitleaks-report.txt
          echo "" >> gitleaks-report.txt

          COUNT=$(jq '[.runs[].results[]] | length' results.sarif)

          if [ "$COUNT" -eq 0 ]; then
            echo "Status : PASSED ✅" >> gitleaks-report.txt
            echo "Secrets Found : 0" >> gitleaks-report.txt
          else
            echo "Status : FAILED ❌" >> gitleaks-report.txt
            echo "Secrets Found : $COUNT" >> gitleaks-report.txt
            echo "" >> gitleaks-report.txt

            jq -r '
            .runs[].results[] |
            "Rule    : \(.ruleId)
            File    : \(.locations[0].physicalLocation.artifactLocation.uri)
            Line    : \(.locations[0].physicalLocation.region.startLine)
            Message : \(.message.text)
            --------------------------------------------------"
            ' results.sarif >> gitleaks-report.txt
          fi

      - name: Upload Readable Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-readable-report
          path: gitleaks-report.txt

      - name: Discord Notification
        if: always()
        run: |
          STATUS="PASSED"

          if grep -q '"ruleId"' results.sarif; then
            STATUS="FAILED"
          fi

          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -F 'payload_json={
              "content":"**Credential Scan Report**\n\nRepository: '"${{ github.repository }}"'\nBranch: '"${{ github.ref_name }}"'\nTriggered By: '"${{ github.actor }}"'\nStatus: '"${STATUS}"'"
            }' \
            -F "file=@gitleaks-report.txt"

      - name: Fail Workflow if Secrets Found
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "Secrets detected."
          exit 1

# -------------------------------------------------------------
# DOCKER BUILD + TRIVY + PUSH
# -------------------------------------------------------------
  docker-build-push:
    name: Docker Build, Trivy Scan & Push
    needs: credential-scan
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Image Tag
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Set Docker Repository
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "IMAGE_NAME=${{ github.event.inputs.docker_repo }}" >> $GITHUB_ENV
          else
            echo "IMAGE_NAME=${{ env.DEFAULT_IMAGE_NAME }}" >> $GITHUB_ENV
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build locally
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TIMESTAMP }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy Scan
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TIMESTAMP }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      # Generate SARIF
      - name: Generate Trivy SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TIMESTAMP }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # Push only if Trivy passed
      - name: Push Docker Image
        if: success()
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TIMESTAMP }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Discord Notification
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
          -d '{
            "content":"✅ Docker Image Built, Trivy Scan Passed and Image Pushed Successfully.\nRepository: ${{ github.repository }}\nImage: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TIMESTAMP }}"
          }'
