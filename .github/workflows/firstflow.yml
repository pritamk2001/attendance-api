name: Credential Scanning

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  credential-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Gitleaks Scan
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: results.sarif

      - name: Generate Readable Report
        if: always()
        run: |
          echo "====================================================" > gitleaks-report.txt
          echo "           GITLEAKS CREDENTIAL SCAN REPORT" >> gitleaks-report.txt
          echo "====================================================" >> gitleaks-report.txt
          echo "" >> gitleaks-report.txt
          echo "Repository : ${{ github.repository }}" >> gitleaks-report.txt
          echo "Branch     : ${{ github.ref_name }}" >> gitleaks-report.txt
          echo "Triggered By : ${{ github.actor }}" >> gitleaks-report.txt
          echo "Commit ID  : ${{ github.sha }}" >> gitleaks-report.txt
          echo "Workflow   : ${{ github.workflow }}" >> gitleaks-report.txt
          echo "Run Number : ${{ github.run_number }}" >> gitleaks-report.txt
          echo "Run URL    : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> gitleaks-report.txt
          echo "Generated  : $(date -u)" >> gitleaks-report.txt
          echo "" >> gitleaks-report.txt

          COUNT=$(jq '[.runs[].results[]] | length' results.sarif)

          echo "====================================================" >> gitleaks-report.txt
          echo "SCAN SUMMARY" >> gitleaks-report.txt
          echo "====================================================" >> gitleaks-report.txt

          if [ "$COUNT" -eq 0 ]; then
            echo "Status              : PASSED ✅" >> gitleaks-report.txt
            echo "Secrets Found       : 0" >> gitleaks-report.txt
            echo "" >> gitleaks-report.txt
            echo "No credentials or secrets were detected." >> gitleaks-report.txt
          else
            echo "Status              : FAILED ❌" >> gitleaks-report.txt
            echo "Secrets Found       : $COUNT" >> gitleaks-report.txt
            echo "" >> gitleaks-report.txt

            echo "====================================================" >> gitleaks-report.txt
            echo "LEAK DETAILS" >> gitleaks-report.txt
            echo "====================================================" >> gitleaks-report.txt

            jq -r '
            .runs[].results[] |
            "Rule        : \(.ruleId)\nFile        : \(.locations[0].physicalLocation.artifactLocation.uri)\nLine        : \(.locations[0].physicalLocation.region.startLine)\nMessage     : \(.message.text)\n----------------------------------------------------"
            ' results.sarif >> gitleaks-report.txt

            echo "" >> gitleaks-report.txt
            echo "====================================================" >> gitleaks-report.txt
            echo "RECOMMENDATION" >> gitleaks-report.txt
            echo "====================================================" >> gitleaks-report.txt
            echo "1. Remove the exposed secret from the repository." >> gitleaks-report.txt
            echo "2. Rotate the leaked credentials immediately." >> gitleaks-report.txt
            echo "3. Rewrite Git history if the secret was committed." >> gitleaks-report.txt
            echo "4. Push the updated code after verification." >> gitleaks-report.txt
          fi

      - name: Send Discord Notification
        if: always()
        run: |
          STATUS=" PASSED"

          if grep -q '"ruleId"' results.sarif; then
            STATUS=" FAILED"
          fi

          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -F 'payload_json={
              "content":"**Credential Scan Report**\n\nRepository: '"${{ github.repository }}"'\nBranch: '"${{ github.ref_name }}"'\nTriggered By: '"${{ github.actor }}"'\nCommit: '"${{ github.sha }}"'\nStatus: '"${STATUS}"'\n📦 Detailed Gitleaks report."
            }' \
            -F "file=@gitleaks-report.txt"

      - name: Fail Workflow if Leaks Found
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo " Secrets detected by Gitleaks."
          exit 1
