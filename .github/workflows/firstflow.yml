name: Credential Scanning, Trivy Scan & Docker Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      docker_repo:
        description: "Docker Repository Name"
        required: true
        default: "vm-process"
        type: string

env:
  DEFAULT_IMAGE_NAME: vm-process

jobs:
# --------- CREDENTIAL SCAN (NO NOTIFICATION HERE) ---------
  credential-scan:
    name: Credential Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Gitleaks Scan
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks SARIF Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: results.sarif

      - name: Generate Readable Report
        if: always()
        run: |
          echo "====================================================" > gitleaks-report.txt
          echo "           GITLEAKS CREDENTIAL SCAN REPORT" >> gitleaks-report.txt
          echo "====================================================" >> gitleaks-report.txt
          echo "" >> gitleaks-report.txt
          echo "Repository : ${{ github.repository }}" >> gitleaks-report.txt
          echo "Branch     : ${{ github.ref_name }}" >> gitleaks-report.txt
          echo "Triggered By : ${{ github.actor }}" >> gitleaks-report.txt
          echo "Commit ID  : ${{ github.sha }}" >> gitleaks-report.txt
          echo "Workflow   : ${{ github.workflow }}" >> gitleaks-report.txt
          echo "Run Number : ${{ github.run_number }}" >> gitleaks-report.txt
          echo "Generated  : $(date -u)" >> gitleaks-report.txt
          echo "" >> gitleaks-report.txt

          COUNT=$(jq '[.runs[].results[]] | length' results.sarif)

          if [ "$COUNT" -eq 0 ]; then
            echo "Status : PASSED ✅" >> gitleaks-report.txt
            echo "Secrets Found : 0" >> gitleaks-report.txt
          else
            echo "Status : FAILED ❌" >> gitleaks-report.txt
            echo "Secrets Found : $COUNT" >> gitleaks-report.txt
            echo "" >> gitleaks-report.txt

            jq -r '
            .runs[].results[] |
            "Rule    : \(.ruleId)
            File    : \(.locations[0].physicalLocation.artifactLocation.uri)
            Line    : \(.locations[0].physicalLocation.region.startLine)
            Message : \(.message.text)
            --------------------------------------------------"
            ' results.sarif >> gitleaks-report.txt
          fi

      - name: Upload Readable Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-readable-report
          path: gitleaks-report.txt

# --------- BUILD, TRIVY, PUSH (SEQUENTIAL) ---------
  docker-build-push:
    name: Docker Build, Trivy Scan & Push
    needs: credential-scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    
    outputs:
      build_status: ${{ steps.build.outcome }}
      trivy_status: ${{ steps.trivy-scan.outcome }}
      push_status: ${{ steps.push.outcome }}
      image_tag: ${{ env.IMAGE_FULL_TAG }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Image Tag
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Set Docker Repository
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "IMAGE_NAME=${{ github.event.inputs.docker_repo }}" >> $GITHUB_ENV
          else
            echo "IMAGE_NAME=${{ env.DEFAULT_IMAGE_NAME }}" >> $GITHUB_ENV
          fi
          echo "IMAGE_FULL_TAG=${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TIMESTAMP }}" >> $GITHUB_ENV

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # STEP 1: BUILD IMAGE
      - name: Build Docker Image
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_FULL_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Status Check
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "BUILD_FAILED=true" >> $GITHUB_ENV
            echo "❌ Build Image Failed" > build-status.txt
          else
            echo "BUILD_FAILED=false" >> $GITHUB_ENV
            echo "✅ Build Image Passed" > build-status.txt
          fi

      - name: Upload Build Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-status
          path: build-status.txt

      # STEP 2: TRIVY SCAN (only if build succeeded)
      - name: Run Trivy Scan
        id: trivy-scan
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_FULL_TAG }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      # Generate Trivy SARIF
      - name: Generate Trivy SARIF
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_FULL_TAG }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy Report
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif

      - name: Upload Trivy SARIF to GitHub Security
        if: always() && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy Status Check
        if: always()
        run: |
          if [ "${{ steps.trivy-scan.outcome }}" = "failure" ]; then
            echo "TRIVY_FAILED=true" >> $GITHUB_ENV
            echo "❌ Trivy Scan Failed - Vulnerabilities Found" > trivy-status.txt
          elif [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "TRIVY_FAILED=true" >> $GITHUB_ENV
            echo "⏭️ Trivy Scan Skipped - Build Failed" > trivy-status.txt
          else
            echo "TRIVY_FAILED=false" >> $GITHUB_ENV
            echo "✅ Trivy Scan Passed" > trivy-status.txt
          fi

      - name: Upload Trivy Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-status
          path: trivy-status.txt

      # STEP 3: PUSH IMAGE (only if trivy passed)
      - name: Push Docker Image
        id: push
        if: steps.build.outcome == 'success' && steps.trivy-scan.outcome == 'success'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_FULL_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push Status Check
        if: always()
        run: |
          if [ "${{ steps.push.outcome }}" = "failure" ]; then
            echo "PUSH_FAILED=true" >> $GITHUB_ENV
            echo "❌ Push Image Failed" > push-status.txt
          elif [ "${{ steps.trivy-scan.outcome }}" = "failure" ] || [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "PUSH_FAILED=true" >> $GITHUB_ENV
            echo "⏭️ Push Skipped - Trivy/Build Failed" > push-status.txt
          else
            echo "PUSH_FAILED=false" >> $GITHUB_ENV
            echo "✅ Push Image Passed" > push-status.txt
          fi

      - name: Upload Push Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: push-status
          path: push-status.txt

# --------- FINAL NOTIFICATION (SARIRF + ALL REPORTS) ---------
  notify:
    name: Send Comprehensive Notification
    needs: [credential-scan, docker-build-push]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Notification Report
        run: |
          echo "=================================================" > final-report.txt
          echo "         WORKFLOW EXECUTION REPORT" >> final-report.txt
          echo "=================================================" >> final-report.txt
          echo "" >> final-report.txt
          echo "Repository: ${{ github.repository }}" >> final-report.txt
          echo "Branch: ${{ github.ref_name }}" >> final-report.txt
          echo "Commit: ${{ github.sha }}" >> final-report.txt
          echo "Triggered By: ${{ github.actor }}" >> final-report.txt
          echo "Run Number: ${{ github.run_number }}" >> final-report.txt
          echo "Timestamp: $(date -u)" >> final-report.txt
          echo "" >> final-report.txt
          echo "=================================================" >> final-report.txt
          echo "STAGE-WISE STATUS" >> final-report.txt
          echo "=================================================" >> final-report.txt
          echo "" >> final-report.txt

          # Cred Scan Report
          echo "📋 CREDENTIAL SCAN:" >> final-report.txt
          if [ -f artifacts/gitleaks-readable-report/gitleaks-report.txt ]; then
            cat artifacts/gitleaks-readable-report/gitleaks-report.txt >> final-report.txt
          else
            echo "Report not found" >> final-report.txt
          fi
          echo "" >> final-report.txt

          # Build Status
          echo "🔨 BUILD STATUS:" >> final-report.txt
          if [ -f artifacts/build-status/build-status.txt ]; then
            cat artifacts/build-status/build-status.txt >> final-report.txt
          else
            echo "Status not found" >> final-report.txt
          fi
          echo "" >> final-report.txt

          # Trivy Scan Report
          echo "🔍 TRIVY SCAN STATUS:" >> final-report.txt
          if [ -f artifacts/trivy-status/trivy-status.txt ]; then
            cat artifacts/trivy-status/trivy-status.txt >> final-report.txt
          else
            echo "Status not found" >> final-report.txt
          fi
          echo "" >> final-report.txt
          
          if [ -f artifacts/trivy-results/trivy-results.sarif ]; then
            echo "--- Trivy SARIF Report ---" >> final-report.txt
            cat artifacts/trivy-results/trivy-results.sarif >> final-report.txt
            echo "" >> final-report.txt
          fi

          # Push Status
          echo "📤 PUSH STATUS:" >> final-report.txt
          if [ -f artifacts/push-status/push-status.txt ]; then
            cat artifacts/push-status/push-status.txt >> final-report.txt
          else
            echo "Status not found" >> final-report.txt
          fi
          echo "" >> final-report.txt

          # Overall Status
          echo "=================================================" >> final-report.txt
          echo "OVERALL RESULT" >> final-report.txt
          echo "=================================================" >> final-report.txt
          
          if [ "${{ needs.credential-scan.result }}" = "failure" ] || \
             [ "${{ needs.docker-build-push.result }}" = "failure" ]; then
            echo "❌ WORKFLOW FAILED" >> final-report.txt
            WORKFLOW_STATUS="FAILED"
          else
            echo "✅ WORKFLOW PASSED" >> final-report.txt
            WORKFLOW_STATUS="PASSED"
          fi
          
          echo "WORKFLOW_STATUS=${WORKFLOW_STATUS}" >> $GITHUB_ENV

      - name: Discord Notification
        if: always()
        run: |
          CRED_STATUS="✅"
          BUILD_STATUS="✅"
          TRIVY_STATUS="✅"
          PUSH_STATUS="✅"

          if grep -q "FAILED" artifacts/gitleaks-readable-report/gitleaks-report.txt 2>/dev/null; then
            CRED_STATUS="❌"
          fi

          if grep -q "Failed" artifacts/build-status/build-status.txt 2>/dev/null; then
            BUILD_STATUS="❌"
          fi

          if grep -q "Failed" artifacts/trivy-status/trivy-status.txt 2>/dev/null; then
            TRIVY_STATUS="❌"
          fi

          if grep -q "Failed" artifacts/push-status/push-status.txt 2>/dev/null; then
            PUSH_STATUS="❌"
          fi

          WEBHOOK="${{ secrets.DISCORD_WEBHOOK }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"
          WORKFLOW_STATUS="${{ env.WORKFLOW_STATUS }}"
          IMAGE_TAG="${{ needs.docker-build-push.outputs.image_tag }}"

          curl -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{
              "content":"**WORKFLOW COMPLETE**",
              "embeds":[{
                "title":"Credential Scan, Build & Trivy Report",
                "color":'$(if [ "$WORKFLOW_STATUS" = "PASSED" ]; then echo "3066993"; else echo "15158332"; fi)',
                "fields":[
                  {"name":"Repository","value":"'"$REPO"'","inline":true},
                  {"name":"Branch","value":"'"$BRANCH"'","inline":true},
                  {"name":"Triggered By","value":"'"$ACTOR"'","inline":true},
                  {"name":"Credential Scan","value":"'"$CRED_STATUS"'","inline":true},
                  {"name":"Build Image","value":"'"$BUILD_STATUS"'","inline":true},
                  {"name":"Trivy Scan","value":"'"$TRIVY_STATUS"'","inline":true},
                  {"name":"Push Image","value":"'"$PUSH_STATUS"'","inline":true},
                  {"name":"Overall Status","value":"'"$WORKFLOW_STATUS"'","inline":true},
                  {"name":"Image Tag","value":"'"$IMAGE_TAG"'","inline":false}
                ]
              }]
            }'

      - name: Upload Final Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-comprehensive-report
          path: final-report.txt
