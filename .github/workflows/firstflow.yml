name: Credential Scanning & Docker Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  credential-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Gitleaks Scan
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: results.sarif

      - name: Generate Readable Report
        if: always()
        run: |
          echo "====================================================" > gitleaks-report.txt
          echo "           GITLEAKS CREDENTIAL SCAN REPORT" >> gitleaks-report.txt
          echo "====================================================" >> gitleaks-report.txt
          echo "" >> gitleaks-report.txt
          echo "Repository : ${{ github.repository }}" >> gitleaks-report.txt
          echo "Branch     : ${{ github.ref_name }}" >> gitleaks-report.txt
          echo "Triggered By : ${{ github.actor }}" >> gitleaks-report.txt
          echo "Commit ID  : ${{ github.sha }}" >> gitleaks-report.txt
          echo "Workflow   : ${{ github.workflow }}" >> gitleaks-report.txt
          echo "Run Number : ${{ github.run_number }}" >> gitleaks-report.txt
          echo "Run URL    : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> gitleaks-report.txt
          echo "Generated  : $(date -u)" >> gitleaks-report.txt
          echo "" >> gitleaks-report.txt

          COUNT=$(jq '[.runs[].results[]] | length' results.sarif)

          if [ "$COUNT" -eq 0 ]; then
            echo "Status : PASSED ✅" >> gitleaks-report.txt
            echo "Secrets Found : 0" >> gitleaks-report.txt
          else
            echo "Status : FAILED ❌" >> gitleaks-report.txt
            echo "Secrets Found : $COUNT" >> gitleaks-report.txt

            echo "" >> gitleaks-report.txt
            jq -r '
            .runs[].results[] |
            "Rule    : \(.ruleId)\nFile    : \(.locations[0].physicalLocation.artifactLocation.uri)\nLine    : \(.locations[0].physicalLocation.region.startLine)\nMessage : \(.message.text)\n--------------------------------------------------"
            ' results.sarif >> gitleaks-report.txt
          fi

      - name: Send Discord Notification
        if: always()
        run: |
          STATUS="PASSED"

          if grep -q '"ruleId"' results.sarif; then
            STATUS="FAILED"
          fi

          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -F 'payload_json={
              "content":"**Credential Scan Report**\n\nRepository: '"${{ github.repository }}"'\nBranch: '"${{ github.ref_name }}"'\nTriggered By: '"${{ github.actor }}"'\nCommit: '"${{ github.sha }}"'\nStatus: '"${STATUS}"'"
            }' \
            -F "file=@gitleaks-report.txt"

      - name: Fail Workflow if Leaks Found
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "Secrets detected by Gitleaks."
          exit 1

  docker-build-push:
    name: Build & Push Docker Image
    needs: credential-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/attendance-api:latest
            ${{ secrets.DOCKER_USERNAME }}/attendance-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
