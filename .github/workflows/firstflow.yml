name: Credential Scanning with GitLeaks

on:
  # push:
  #   branches: [ main, develop ]
  # pull_request:
  #   branches: [ main, develop ]
  # schedule:
  #   - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  gitleaks-scan:
    name: Scan Repository for Credentials
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install GitLeaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks-linux-x64
          chmod +x gitleaks-linux-x64
          sudo mv gitleaks-linux-x64 /usr/local/bin/gitleaks
          gitleaks version
      
      - name: Run GitLeaks Scan - Full History
        id: gitleaks_full
        continue-on-error: true
        run: |
          echo "Scanning full commit history..."
          gitleaks detect --source . --verbose --report-path gitleaks-report-full.json || true
      
      - name: Run GitLeaks Scan - Current Branch
        id: gitleaks_branch
        continue-on-error: true
        run: |
          echo "Scanning current branch..."
          gitleaks detect --source . --verbose --report-path gitleaks-report-branch.json || true
      
      - name: Create Summary Report
        if: always()
        run: |
          echo "# GitLeaks Scan Report" > scan-summary.md
          echo "Scan completed at $(date)" >> scan-summary.md
          echo "" >> scan-summary.md
          echo "## Scan Details" >> scan-summary.md
          echo "- **Repository**: $GITHUB_REPOSITORY" >> scan-summary.md
          echo "- **Branch**: $GITHUB_REF" >> scan-summary.md
          echo "- **Commit**: $GITHUB_SHA" >> scan-summary.md
          echo "- **Runner**: Ubuntu 24.04 LTS" >> scan-summary.md
          echo "" >> scan-summary.md
          
          if [ -f gitleaks-report-full.json ]; then
            echo "## Full History Scan Results" >> scan-summary.md
            if [ -s gitleaks-report-full.json ]; then
              LEAK_COUNT=$(jq 'length' gitleaks-report-full.json 2>/dev/null || echo "0")
              echo "- **Total Leaks Found**: $LEAK_COUNT" >> scan-summary.md
              echo "" >> scan-summary.md
              if [ "$LEAK_COUNT" -gt 0 ]; then
                echo "### Detected Secrets:" >> scan-summary.md
                jq -r '.[] | "- **\(.Description)** in `\(.File)` (Line: \(.Line))"' gitleaks-report-full.json >> scan-summary.md || true
              fi
            else
              echo "- **Status**: ✅ No secrets detected!" >> scan-summary.md
            fi
          fi
          
          echo "" >> scan-summary.md
          if [ -f gitleaks-report-branch.json ]; then
            echo "## Current Branch Scan Results" >> scan-summary.md
            if [ -s gitleaks-report-branch.json ]; then
              BRANCH_LEAK_COUNT=$(jq 'length' gitleaks-report-branch.json 2>/dev/null || echo "0")
              echo "- **Total Leaks Found**: $BRANCH_LEAK_COUNT" >> scan-summary.md
            else
              echo "- **Status**: ✅ No secrets detected in current branch!" >> scan-summary.md
            fi
          fi
      
      - name: Upload GitLeaks Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-reports
          path: gitleaks-report-*.json
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Upload Summary Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-summary
          path: scan-summary.md
          retention-days: 30
      
      - name: Check Results
        id: check_results
        if: always()
        run: |
          if [ -f gitleaks-report-full.json ] && [ -s gitleaks-report-full.json ]; then
            LEAK_COUNT=$(jq 'length' gitleaks-report-full.json 2>/dev/null || echo "0")
            echo "leaks_found=$LEAK_COUNT" >> $GITHUB_OUTPUT
            echo "❌ Found $LEAK_COUNT secret(s) in repository!"
            echo "Please review the GitLeaks reports."
            exit 1
          else
            echo "leaks_found=0" >> $GITHUB_OUTPUT
            echo "✅ No credentials detected!"
          fi
      
      - name: Comment on PR (if PR)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('scan-summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  notify-slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    if: always() && secrets.SLACK_WEBHOOK_URL != ''
    steps:
      - name: Send Slack Notification
        run: |
          STATUS="${{ needs.gitleaks-scan.result }}"
          if [ "$STATUS" = "failure" ]; then
            MESSAGE="🚨 GitLeaks scan FAILED - Credentials detected!"
            COLOR="danger"
          else
            MESSAGE="✅ GitLeaks scan passed - No credentials found!"
            COLOR="good"
          fi
          
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"title\": \"GitLeaks Security Scan\",
                \"text\": \"$MESSAGE\",
                \"fields\": [
                  {\"title\": \"Repository\", \"value\": \"${{ github.repository }}\", \"short\": true},
                  {\"title\": \"Branch\", \"value\": \"${{ github.ref }}\", \"short\": true},
                  {\"title\": \"Commit\", \"value\": \"${{ github.sha }}\", \"short\": false}
                ]
              }]
            }"
