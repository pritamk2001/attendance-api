name: Credential Scanning & Docker Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  credential-scan:
    name: Credential Scan
    runs-on: ubuntu-latest

    outputs:
      scan_status: ${{ steps.scan_status.outputs.status }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Gitleaks Scan
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Scan Status
        id: scan_status
        run: |
          if [ "${{ steps.gitleaks.outcome }}" = "failure" ]; then
            echo "status=FAILED" >> $GITHUB_OUTPUT
          else
            echo "status=PASSED" >> $GITHUB_OUTPUT
          fi

      - name: Upload SARIF Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: results.sarif

      - name: Generate Readable Report
        if: always()
        run: |
          echo "====================================================" > gitleaks-report.txt
          echo "          GITLEAKS CREDENTIAL SCAN REPORT" >> gitleaks-report.txt
          echo "====================================================" >> gitleaks-report.txt
          echo "" >> gitleaks-report.txt
          echo "Repository : ${{ github.repository }}" >> gitleaks-report.txt
          echo "Branch     : ${{ github.ref_name }}" >> gitleaks-report.txt
          echo "Triggered By : ${{ github.actor }}" >> gitleaks-report.txt
          echo "Commit ID  : ${{ github.sha }}" >> gitleaks-report.txt
          echo "Workflow   : ${{ github.workflow }}" >> gitleaks-report.txt
          echo "Run Number : ${{ github.run_number }}" >> gitleaks-report.txt
          echo "Run URL    : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> gitleaks-report.txt
          echo "Generated  : $(date -u)" >> gitleaks-report.txt
          echo "" >> gitleaks-report.txt

          if [ "${{ steps.gitleaks.outcome }}" = "failure" ]; then
            echo "Status : FAILED ❌" >> gitleaks-report.txt
          else
            echo "Status : PASSED ✅" >> gitleaks-report.txt
          fi

          echo "" >> gitleaks-report.txt
          echo "==================== LEAK DETAILS ====================" >> gitleaks-report.txt

          if command -v jq >/dev/null && [ -f results.sarif ]; then
            jq -r '
            .runs[].results[]? |
            "Rule      : \(.ruleId)
File      : \(.locations[0].physicalLocation.artifactLocation.uri)
Line      : \(.locations[0].physicalLocation.region.startLine)
Message   : \(.message.text)
------------------------------------------------------"
            ' results.sarif >> gitleaks-report.txt || true
          fi

          echo "" >> gitleaks-report.txt
          echo "================== RECOMMENDATION ====================" >> gitleaks-report.txt
          echo "1. Remove committed secrets." >> gitleaks-report.txt
          echo "2. Rotate exposed credentials." >> gitleaks-report.txt
          echo "3. Rewrite Git history if required." >> gitleaks-report.txt
          echo "4. Re-run the scan before merging." >> gitleaks-report.txt

      - name: Send Discord Notification
        if: always()
        run: |
          if [ "${{ steps.gitleaks.outcome }}" = "failure" ]; then
            STATUS="❌ FAILED"
          else
            STATUS="✅ PASSED"
          fi

          cat > payload.json <<EOF
          {
            "content": "🔐 Credential Scan Report\n\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nTriggered By: ${{ github.actor }}\nCommit: ${{ github.sha }}\nStatus: ${STATUS}\n\n📄 Human-readable report attached.\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -F "payload_json=<payload.json" \
            -F "file=@gitleaks-report.txt"

      - name: Fail Workflow if Leaks Found
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "❌ Secrets detected by Gitleaks."
          exit 1

  docker-build-push:
    name: Build & Push Docker Image
    needs: credential-scan

    if: needs.credential-scan.outputs.scan_status == 'PASSED'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/attendance-api:latest
            ${{ secrets.DOCKER_USERNAME }}/attendance-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
